<!doctype html>
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop the collection · ELARA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
<div id="site-header"></div>
<main>
<section class="wrap shop-head">
  <div><h1 data-c="shop.title"></h1><p class="lead" data-c="shop.text"></p></div>
  <img data-c-src="shop.image" alt="">
</section>
<section class="wrap">
  <div class="shop-bar">
    <div class="chips" id="cats" role="group" aria-label="Category"></div>
    <label class="sort">Sort by
      <select id="sort"><option value="featured">Featured</option><option value="low">Price, low to high</option><option value="high">Price, high to low</option><option value="name">Name, A to Z</option></select>
    </label>
  </div>
  <p class="muted" id="result" aria-live="polite"></p>
  <div class="grid3 shop-grid" id="grid"></div>
</section>
</main>
<div id="site-footer"></div>
<script src="js/defaults.js"></script>
<script src="js/app.js"></script>
</body>
</html>
